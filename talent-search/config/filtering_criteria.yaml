# Filtering Criteria for Talent Search
search_keywords:
  exact_match: 'SQA'
  integrated: 'AI활용'

criteria:
  - 'SQA(Software Quality Assurance) 경력 3년 이상'
  - 'Python 또는 Java 활용 능력 보유'
  - '테스트 자동화(Automation) 경험 우대'
  - '금융 또는 커머스 도메인 경험 우대'

llm:
  model: 'gpt-4o'
  max_tokens: 500
  temperature: 0.1
